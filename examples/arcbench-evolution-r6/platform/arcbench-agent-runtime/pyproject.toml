[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arcbench-agent-runtime"
version = "0.1.0"
description = "ARC-Bench agent runtime helpers for events, traceability, and git operations."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "ARC-Bench" }
]
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
