# Experimental team: three peers that can hand work to each other over git.
#
# NOT a product default and not loaded by any default path. Select it
# explicitly — `--team-config configs/team.handoff.experiment.yaml`, or
# OPENCOLLAB_TEAM_FILE — and run it with `prebuild_team=True`, which is what it
# is built for. The shipped Self-Collaboration team in
# `opencollab/bootstrap/team_config.py` is untouched by this file.
#
# It exists to measure one thing: whether models hand work to each other when
# they are able to and nothing tells them to. So the prompts in
# `handoff-experiment/` state what each role *can* do and stop there. Scripting
# the exchange would mean measuring the script.
#
# What makes the handoff possible:
#
#   * Every role carries `message_agent`. A prebuilt team refuses `spawn_agent`
#     for the whole run and the join path never routes a prebuilt peer's result
#     anywhere, so a message is the only thing that crosses between two agents.
#     A role with an outgoing edge and no `message_agent` is seated mute — and
#     `build_scheduler` refuses such a team rather than running it silently.
#   * The Coder and the Tester both carry `bash`, so both can run `git`: one can
#     commit, the other can check out what was committed.
#   * Each agent works in its own git worktree of the one repository. Linked
#     worktrees share `.git/objects`, so a sha committed in one is reachable
#     from the others immediately — the sha is the whole payload of a handoff.
#
# The tool bundles are the shipped ones with exactly those changes: the
# Analyst's `spawn_agent` is replaced by `message_agent`, `team_status` is added
# everywhere so an agent can resolve a teammate's aid, and the Tester gains
# `bash`. No role has `spawn_agent`: on a prebuilt team it can only be refused.
entry: analyst

roles:
  analyst:
    prompt_file: handoff-experiment/analyst.md
    tools: [ask_user, file_read, grep, message_agent, team_status, use_skill]

  coder:
    prompt_file: handoff-experiment/coder.md
    tools: [apply_patch, bash, file_read, grep, message_agent, run_tests, team_status]

  tester:
    prompt_file: handoff-experiment/tester.md
    tools: [bash, file_read, git_diff, grep, message_agent, run_tests, team_status]

# Six directed edges — every ordered pair. The return edges are the point: a
# closed star (analyst -> coder, analyst -> tester, and nothing back) is what
# makes a prebuilt team mute, because a prebuilt peer has no join path to
# deliver a result on.
topology:
  analyst: [coder, tester]
  coder: [analyst, tester]
  tester: [analyst, coder]
