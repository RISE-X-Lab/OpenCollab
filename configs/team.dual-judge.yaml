# WHAT THIS FAMILY IS
#
# Three seats: an Adopter and two Coders that cannot see or address each other.
# The Adopter is the only channel between them, so what crosses is whatever it
# chose to write. Coder A is asked for the narrowest change that accounts for
# the defect, Coder B for one that covers the stated requirement wherever the
# code implements it; which of the two this run delivers is the Adopter's call.
#
# It is the organization G22 runs as a workflow, seated as a team. Under G22 the
# two candidate agents are `await`ed and the choice between them is a Python
# function, so "two candidates were produced and one was adopted" is true by
# construction. Here every one of those steps is something an agent may or may
# not do, which is the only condition under which it can be measured.
#
# ONE AT A TIME. The cards that command anything command the Adopter to ask one
# Coder, and to write the second its own brief once the first has answered.
# Turns are serialized by the harness regardless (`serialize_turns=True`,
# `evaluator_sessions.py:383`), and that setting is recorded on every run under
# `assigned.topology_nodes.turns_serialized`.
#
# NOT BEST-OF-2. The second candidate is written after the Adopter has seen the
# first, so the two are not independent draws.
#
# NOT A RUNG OF THE HANDOFF LADDER AND NOT POOLABLE WITH ONE. Different body,
# different roster, different topology; see `configs/dual-candidate/variants.yaml`
# for the cell-for-cell correspondence.
#
# THIS CELL: the reference cell, against `facts-v2`. It commands nothing --
# the block names no role and is that cell's file byte for byte.
entry: adopter

roles:
  adopter:
    prompt_file: dual-candidate/adopter.dual-judge.md
    tools: [apply_patch, bash, file_read, file_write, grep, message_agent, run_tests, submit, team_status]

  coder_a:
    prompt_file: dual-candidate/coder-a.md
    tools: [apply_patch, bash, file_read, file_write, grep, message_agent, run_tests, submit, team_status]

  coder_b:
    prompt_file: dual-candidate/coder-b.md
    tools: [apply_patch, bash, file_read, file_write, grep, message_agent, run_tests, submit, team_status]

# Four directed edges, not six. The Adopter reaches both Coders and both reach
# it back -- the return edges are what make a prebuilt peer able to deliver at
# all. `coder_a` and `coder_b` are NOT connected: the scheduler refuses a
# message between them (`_scheduler_team.py:188`), so anything one Coder learns
# of the other's work is something the Adopter decided to tell it.
topology:
  adopter: [coder_a, coder_b]
  coder_a: [adopter]
  coder_b: [adopter]
