# Example OpenCollab team definition.
#
# Copy this to `configs/team.yaml`, then pass `--team-config configs/team.yaml`
# (or point OPENCOLLAB_TEAM_FILE at it) to replace the built-in Self-Collaboration team.
# OpenCollab does not discover team files by filename.
#
# Each role declares its system prompt (inline `prompt:` or `prompt_file:`),
# an optional `model:` override (defaults to OPENCOLLAB_MODEL), an optional
# `temperature:` override (defaults to OPENCOLLAB_TEMPERATURE, 0.2), and the list
# of tool names it may use. `topology` is a directed graph: a source role may
# spawn/message only the roles listed for it.
#
# `entry` (optional) names the role built as agent 0 — the root that receives
# the user task and spawns the rest. If omitted, the resolver prefers a role
# named `lead`, else the first declared role. Set it explicitly when your root
# is not called `lead` (e.g. `entry: analyst`).
entry: lead

roles:
  lead:
    tools: [bash, file_read, file_write, grep, git_diff, spawn_agent, spawn_with_review, message_agent, team_status, ask_user]
    prompt: |
      You are agent 0, the primary developer. You do the work directly and can
      spawn specialist agents to parallelize when it helps.



  analyst:
    tools: [bash, file_read, grep]
    prompt: |
      You are an Analyst agent.

  coder:
    tools: [bash, file_read, file_write, apply_patch, grep, message_agent]
    prompt: |
      You are a Coder agent.

  reviewer:
    tools: [bash, file_read, git_diff, grep]
    prompt: |
      You are a Reviewer agent.

topology:
  lead: [analyst, coder, reviewer]
  analyst: [coder]
  coder: [reviewer]
  reviewer: [coder]

# Optional: per-tool output caps (constructor kwargs), to tune tool output
# budgets to the backend's context size. Defaults shown; uncomment to override.
# tool_limits:
#   bash: { max_output_chars: 8000 }
#   git_diff: { max_diff_chars: 8000, max_status_chars: 2000 }
#   file_read: { max_read_chars: 30000 }
#   grep: { max_grep_chars: 10000 }

# Optional: the context policy every agent's session runs. `default` (the value
# when omitted) is the lazy-degradation pipeline: a per-tool-result budget, then
# pressure-triggered clearing of old tool output, snipping of old turns and
# summarization. `no_history_compaction` keeps only the per-result budget.
# Unknown names or keys are refused at load.
# context: default
# context: { policy: no_history_compaction, tool_result_budget: 20000 }

# Optional: token allowances. `budget.tokens` at the top level is every role's
# allowance; a role may state its own `budget: { tokens: N }`. Once any role has
# one, every role must, and the allowances are independent: each agent is held
# to its own and nothing else, and the team total is their sum. Requires a
# declared roster (`prebuild_team=True`); `client.team(budget=)` is then refused.
# Omitted, the team shares one pool of the run's budget.
# budget: { tokens: 2000000 }
