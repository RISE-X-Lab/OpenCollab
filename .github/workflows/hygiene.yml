name: Hygiene

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  added-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check files added by the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 scripts/check_added_files.py "$BASE_SHA" "$HEAD_SHA"
      - name: Check the complete main tree
        if: github.event_name == 'push'
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          EMPTY_TREE="$(git hash-object -t tree /dev/null)"
          python3 scripts/check_added_files.py "$EMPTY_TREE" "$HEAD_SHA" --require-files
