name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Lint (whole repo)
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q

  macos-integrity:
    name: macOS path integrity
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Execute the macOS path-integrity proof
        run: |
          uv run pytest -q -p no:cacheprovider --junitxml="$RUNNER_TEMP/h68.xml" \
            tests/test_safe_files.py::test_read_rejects_final_symlink_and_symlink_parent \
            tests/test_safe_files.py::test_write_rejects_nested_ancestor_symlink \
            tests/test_safe_files.py::test_read_rejects_fifo_without_blocking \
            tests/test_local_env_processes.py::test_local_file_operations_reject_symlink_and_escape
          uv run python - "$RUNNER_TEMP/h68.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          suites = list(root.findall("testsuite")) if root.tag == "testsuites" else [root]
          totals = {
              field: sum(int(suite.attrib[field]) for suite in suites)
              for field in ("tests", "skipped", "failures", "errors")
          }
          assert totals == {"tests": 4, "skipped": 0, "failures": 0, "errors": 0}, totals
          PY
