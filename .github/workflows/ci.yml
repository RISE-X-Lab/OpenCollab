name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: opencollab
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Lint (whole repo)
        working-directory: .
        run: uv run --project opencollab ruff check .
      - name: Test
        run: uv run pytest -q

  macos-integrity:
    name: macOS path integrity
    runs-on: macos-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: opencollab
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Execute the macOS path-integrity proof
        run: |
          uv run pytest -q -p no:cacheprovider --junitxml="$RUNNER_TEMP/h68.xml" \
            tests/test_posix_file_support.py::test_macos_alias_normalization_still_rejects_descendant_symlink
          uv run python - "$RUNNER_TEMP/h68.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          suites = list(root.findall("testsuite")) if root.tag == "testsuites" else [root]
          totals = {
              field: sum(int(suite.attrib[field]) for suite in suites)
              for field in ("tests", "skipped", "failures", "errors")
          }
          assert totals == {"tests": 1, "skipped": 0, "failures": 0, "errors": 0}, totals
          PY
