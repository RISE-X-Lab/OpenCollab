name: Conventional Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check the pull request title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          python3 scripts/check_conventional_title.py --title "$TITLE"
      - name: Check the pushed commit title
        if: github.event_name == 'push'
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/check_conventional_title.py --commit "$COMMIT_SHA"
