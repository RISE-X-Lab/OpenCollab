[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opencollab"
version = "0.1.0"
description = "Minimal multi-agent software development framework — first principles, context isolation, tool-based delegation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "openai>=1.30",
    "anthropic>=0.40",
    "typer>=0.12",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "filelock>=3.15",
    "pydantic>=2.0",
    "requests>=2.34.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
docker = ["docker>=7.0"]
swebench = ["datasets>=2.0", "tqdm>=4.0", "docker>=7.0", "swebench"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.5"]

[project.scripts]
opencollab = "opencollab.adapters.cli.main:app"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
