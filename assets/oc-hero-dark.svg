<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" font-family="'Times New Roman', Times, Georgia, serif" stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#2563EB"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#1A2740" stroke-width="1"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/></filter><filter id="shsm" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.30"/></filter><linearGradient id="schg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#141F33"/><stop offset="1" stop-color="#1C1836"/></linearGradient><marker id="apr" viewBox="0 0 10 10" refX="7.8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1.4 1.6 L9 5 L1.4 8.4 Z" fill="#A78BFA" stroke="#A78BFA" stroke-width="1.5" stroke-linejoin="round"/></marker><marker id="abl" viewBox="0 0 10 10" refX="7.8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1.4 1.6 L9 5 L1.4 8.4 Z" fill="#60A5FA" stroke="#60A5FA" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><rect width="1600" height="700" fill="#0F172A"/><rect width="1600" height="700" fill="url(#grid)"/><rect x="72" y="48" width="704" height="452" rx="20" fill="#182234" stroke="#2B3A50" stroke-width="1.5" filter="url(#sh)"/><text x="112" y="98" font-size="34" fill="#F1F5F9" text-anchor="start" font-weight="700">Team</text><rect x="578" y="74" width="158" height="28" rx="14" fill="#2C2350"/><text x="657" y="94" font-size="13" fill="#C4B5FD" text-anchor="middle" font-weight="700" letter-spacing="1.2">LLM-ORCHESTRATED</text><text x="112" y="128" font-size="17" fill="#9AA8BE" text-anchor="start" font-weight="400">The LLM organizes specialists at runtime.</text><line x1="244" y1="209" x2="244" y2="323" stroke="#A78BFA" stroke-width="2.4" marker-end="url(#apr)"/><line x1="266" y1="323" x2="266" y2="209" stroke="#A78BFA" stroke-width="2.4" marker-end="url(#apr)"/><line x1="274" y1="342" x2="459" y2="342" stroke="#A78BFA" stroke-width="2.4" marker-end="url(#apr)"/><path d="M497.8 331.4 Q577 278 652.9 329.1" fill="none" stroke="#A78BFA" stroke-width="2.4" marker-end="url(#apr)"/><path d="M656.2 352.6 Q577 406 501.1 354.9" fill="none" stroke="#A78BFA" stroke-width="2.4" marker-end="url(#apr)"/><circle cx="255" cy="190" r="19" fill="#A78BFA"/><circle cx="255" cy="342" r="19" fill="#A78BFA"/><circle cx="482" cy="342" r="19" fill="#A78BFA"/><circle cx="672" cy="342" r="19" fill="#A78BFA"/><text x="255" y="152" font-size="17" fill="#F1F5F9" text-anchor="middle" font-weight="400">Lead</text><text x="255" y="384" font-size="17" fill="#F1F5F9" text-anchor="middle" font-weight="400">Analyst</text><text x="482" y="305" font-size="17" fill="#F1F5F9" text-anchor="middle" font-weight="400">Coder</text><text x="672" y="305" font-size="17" fill="#F1F5F9" text-anchor="middle" font-weight="400">Tester</text><text x="577" y="396" font-size="13" fill="#6B7C97" text-anchor="middle" font-weight="400">generate ⇄ critique</text><line x1="112" y1="426" x2="736" y2="426" stroke="#2B3A50" stroke-width="1"/><text x="112" y="456" font-size="16" fill="#B6C2D6" text-anchor="start" font-weight="400">Define who delegates, collaborates, and reviews.</text><text x="112" y="480" font-size="15" fill="#6B7C97" text-anchor="start" font-weight="400">Best for open-ended tasks where the plan emerges.</text><rect x="824" y="48" width="704" height="452" rx="20" fill="#182234" stroke="#2B3A50" stroke-width="1.5" filter="url(#sh)"/><text x="864" y="98" font-size="34" fill="#F1F5F9" text-anchor="start" font-weight="700">Dynamic Workflow</text><rect x="1322" y="74" width="166" height="28" rx="14" fill="#1C2C4C"/><text x="1405" y="94" font-size="13" fill="#93C5FD" text-anchor="middle" font-weight="700" letter-spacing="1.2">CODE-ORCHESTRATED</text><text x="864" y="128" font-size="17" fill="#9AA8BE" text-anchor="start" font-weight="400">Python runs deterministic steps, reproducible every run.</text><line x1="983" y1="258" x2="1024.3" y2="258" stroke="#60A5FA" stroke-width="2.4" marker-end="url(#abl)"/><line x1="1152.3" y1="258" x2="1193.7" y2="258" stroke="#60A5FA" stroke-width="2.4" marker-end="url(#abl)"/><line x1="1321.7" y1="258" x2="1363" y2="258" stroke="#60A5FA" stroke-width="2.4" marker-end="url(#abl)"/><path d="M1260.7 286 L1260.7 312 Q1260.7 326 1246.7 326 L1105.3 326 Q1091.3 326 1091.3 312 L1091.3 298" fill="none" stroke="#60A5FA" stroke-width="2.4" marker-end="url(#abl)"/><text x="1176" y="344" font-size="13" fill="#6B7C97" text-anchor="middle" font-weight="400">re-run if incomplete</text><rect x="864" y="230" width="116" height="56" rx="12" fill="#1E293B" stroke="#33445E" stroke-width="1.5" filter="url(#shsm)"/><rect x="873" y="246" width="4" height="24" rx="2" fill="#60A5FA"/><text x="928" y="264" font-size="16" fill="#E7EDF5" text-anchor="middle" font-weight="400">Analyst</text><rect x="1045.3" y="242" width="116" height="56" rx="12" fill="#141F33" stroke="#33445E" stroke-width="1.5"/><rect x="1039.3" y="236" width="116" height="56" rx="12" fill="#141F33" stroke="#33445E" stroke-width="1.5"/><rect x="1033.3" y="230" width="116" height="56" rx="12" fill="#1E293B" stroke="#33445E" stroke-width="1.5" filter="url(#shsm)"/><rect x="1042.3" y="246" width="4" height="24" rx="2" fill="#60A5FA"/><text x="1097.3" y="264" font-size="16" fill="#E7EDF5" text-anchor="middle" font-weight="400">Scouts</text><rect x="1109.3" y="216" width="44" height="26" rx="13" fill="#1C2C4C"/><text x="1131.3" y="233" font-size="13" fill="#93C5FD" text-anchor="middle" font-weight="700">× N</text><rect x="1202.7" y="230" width="116" height="56" rx="12" fill="#1E293B" stroke="#33445E" stroke-width="1.5" filter="url(#shsm)"/><rect x="1211.7" y="246" width="4" height="24" rx="2" fill="#60A5FA"/><text x="1266.7" y="264" font-size="16" fill="#E7EDF5" text-anchor="middle" font-weight="400">Synthesize</text><rect x="1372" y="230" width="116" height="56" rx="12" fill="#1E293B" stroke="#33445E" stroke-width="1.5" filter="url(#shsm)"/><rect x="1381" y="246" width="4" height="24" rx="2" fill="#60A5FA"/><text x="1436" y="264" font-size="16" fill="#E7EDF5" text-anchor="middle" font-weight="400">Summary</text><line x1="864" y1="426" x2="1488" y2="426" stroke="#2B3A50" stroke-width="1"/><text x="864" y="456" font-size="16" fill="#B6C2D6" text-anchor="start" font-weight="400">Dispatch parallel work, then synthesize and summarize.</text><text x="864" y="480" font-size="15" fill="#6B7C97" text-anchor="start" font-weight="400">Best for repeatable pipelines with known, ordered steps.</text><line x1="424" y1="500" x2="424" y2="524" stroke="#475569" stroke-width="2"/><circle cx="424" cy="524" r="4" fill="#475569"/><line x1="1176" y1="500" x2="1176" y2="524" stroke="#475569" stroke-width="2"/><circle cx="1176" cy="524" r="4" fill="#475569"/><rect x="72" y="524" width="1456" height="124" rx="18" fill="url(#schg)" stroke="#2B3A50" stroke-width="1.5"/><text x="120" y="580" font-size="25" fill="#F1F5F9" text-anchor="start" font-weight="700">Scheduler Layer</text><text x="120" y="608" font-size="16" fill="#9AA8BE" text-anchor="start" font-weight="400">One runtime schedules every agent — concurrency, budgets, message-passing. A tiny OS for agents.</text><line x1="940" y1="556" x2="1470" y2="556" stroke="#2A3648" stroke-width="2"/><rect x="960" y="553" width="110" height="6" rx="3" fill="#3A485F"/><rect x="1090" y="553" width="70" height="6" rx="3" fill="#3A485F"/><rect x="1180" y="553" width="130" height="6" rx="3" fill="#3A485F"/><rect x="1330" y="553" width="60" height="6" rx="3" fill="#3A485F"/><line x1="940" y1="582" x2="1470" y2="582" stroke="#2A3648" stroke-width="2"/><rect x="950" y="579" width="80" height="6" rx="3" fill="#3A485F"/><rect x="1070" y="579" width="120" height="6" rx="3" fill="url(#g)"/><rect x="1210" y="579" width="90" height="6" rx="3" fill="#3A485F"/><rect x="1310" y="579" width="80" height="6" rx="3" fill="#3A485F"/><line x1="940" y1="608" x2="1470" y2="608" stroke="#2A3648" stroke-width="2"/><rect x="980" y="605" width="130" height="6" rx="3" fill="#3A485F"/><rect x="1130" y="605" width="70" height="6" rx="3" fill="#3A485F"/><rect x="1270" y="605" width="110" height="6" rx="3" fill="#3A485F"/><rect x="1400" y="605" width="50" height="6" rx="3" fill="#3A485F"/></svg>
