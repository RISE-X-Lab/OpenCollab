<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="title description">
  <title id="title">Pass@1 on SWE-bench Pro, Terminal-Bench 2.1, and DeepSWE</title>
  <desc id="description">Five harnesses with the same model, GPT-5.6-Luna. OpenCollab (Duo) has the highest Pass@1 on all three benchmarks. OpenCollab (Duo): SWE-bench Pro 64.25%, Terminal-Bench 2.1 83.15%, DeepSWE 69.91%; OpenCollab (Base): SWE-bench Pro 63.21%, Terminal-Bench 2.1 79.78%, DeepSWE 55.75%; Claude Code: SWE-bench Pro 58.03%, Terminal-Bench 2.1 77.53%, DeepSWE 56.64%; Codex CLI: SWE-bench Pro 63.73%, Terminal-Bench 2.1 80.90%, DeepSWE 47.79%; Mini-SWE-Agent: SWE-bench Pro 61.66%, Terminal-Bench 2.1 76.40%, DeepSWE 61.95%.</desc>
