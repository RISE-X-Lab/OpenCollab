<svg xmlns="http://www.w3.org/2000/svg" width="980" height="688" viewBox="0 0 980 688" role="img" aria-labelledby="title description">
  <title id="title">Cross-harness benchmark results</title>
  <desc id="description">Five harnesses on SWE-bench Pro, Terminal-Bench 2.1, and DeepSWE. OC Duo has the highest reported Pass@1 in each group. Columns show Pass@1, average tokens, estimated average cost, and cache hit.</desc>
